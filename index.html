<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exoplanet Explorer</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body { margin: 0; background-color: #030712; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(167,139,250,0.4); border-radius:99px; }
    input[type=range] { -webkit-appearance:none; height:4px; background:rgba(255,255,255,0.15); border-radius:99px; outline:none; cursor:pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#a78bfa; box-shadow:0 0 8px rgba(167,139,250,0.4); cursor:pointer; }
    select option { background:#1a1a2e; color:#fff; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ─── COLOR PALETTE & CONSTANTS ───────────────────────────────
    const COLORS = {
      pink: "#f472b6", pinkDark: "#db2777", pinkGlow: "rgba(244,114,182,0.4)",
      blue: "#60a5fa", blueDark: "#2563eb", blueGlow: "rgba(96,165,250,0.4)",
      purple: "#a78bfa", purpleDark: "#7c3aed", purpleGlow: "rgba(167,139,250,0.4)",
      cyan: "#22d3ee", bg: "#030712", surface: "rgba(255,255,255,0.04)", border: "rgba(255,255,255,0.08)",
    };

    const EXOPLANETS = [
      { id:1, name:"Kepler-452b", radius:1.63, mass:5.0, temp:265, distance:1402, star:"Kepler-452", method:"Transit", habitable:true, year:2015, type:"Super-Earth", desc:"Often called Earth's cousin, orbiting in the habitable zone of a Sun-like star." },
      { id:2, name:"TRAPPIST-1e", radius:0.92, mass:0.77, temp:251, distance:39, star:"TRAPPIST-1", method:"Transit", habitable:true, year:2017, type:"Earth-sized", desc:"One of the most promising candidates for habitability in the TRAPPIST-1 system." },
      { id:3, name:"HD 209458 b", radius:13.0, mass:220, temp:1130, distance:159, star:"HD 209458", method:"Transit", habitable:false, year:1999, type:"Hot Jupiter", desc:"First exoplanet confirmed by transit method, nicknamed 'Osiris'." },
      { id:4, name:"51 Pegasi b", radius:11.2, mass:150, temp:1200, distance:50, star:"51 Pegasi", method:"Radial Velocity", habitable:false, year:1995, type:"Hot Jupiter", desc:"The first exoplanet discovered orbiting a Sun-like star." },
      { id:5, name:"Proxima Centauri b", radius:1.1, mass:1.27, temp:234, distance:4.2, star:"Proxima Centauri", method:"Radial Velocity", habitable:true, year:2016, type:"Earth-sized", desc:"Closest known exoplanet to Earth, orbiting our nearest stellar neighbor." },
      { id:6, name:"GJ 1214 b", radius:2.7, mass:6.5, temp:393, distance:47, star:"GJ 1214", method:"Transit", habitable:false, year:2009, type:"Mini-Neptune", desc:"A water world with a thick steamy atmosphere — a new class of planet." },
      { id:7, name:"Kepler-186f", radius:1.17, mass:1.44, temp:188, distance:582, star:"Kepler-186", method:"Transit", habitable:true, year:2014, type:"Earth-sized", desc:"First Earth-sized planet confirmed in the habitable zone of another star." },
      { id:8, name:"55 Cancri e", radius:1.9, mass:8.6, temp:2400, distance:41, star:"55 Cancri", method:"Transit", habitable:false, year:2004, type:"Super-Earth", desc:"A lava world with a surface possibly covered in molten silicates." },
      { id:9, name:"WASP-17b", radius:18.5, mass:160, temp:1771, distance:1000, star:"WASP-17", method:"Transit", habitable:false, year:2009, type:"Hot Jupiter", desc:"One of the largest known exoplanets, orbiting its star in the opposite direction." },
      { id:10, name:"K2-18b", radius:2.6, mass:8.9, temp:265, distance:124, star:"K2-18", method:"Transit", habitable:true, year:2015, type:"Mini-Neptune", desc:"A temperate sub-Neptune with water vapor detected in its atmosphere." },
    ];

    const QUIZ_QUESTIONS = [
      { q:"Which method detects planets by measuring starlight dips?", options:["Radial Velocity","Direct Imaging","Transit Method","Gravitational Lensing"], correct:2, xp:100, fact:"The Transit Method watches for periodic dimming as a planet crosses its star." },
      { q:"What temperature range defines Earth's liquid water habitable zone?", options:["0–50 K","100–200 K","273–373 K","1000–2000 K"], correct:2, xp:120, fact:"Liquid water exists between 273 K (0°C) and 373 K (100°C) at sea level pressure." },
      { q:"Which exoplanet is closest to Earth?", options:["Kepler-452b","TRAPPIST-1e","Proxima Centauri b","HD 209458 b"], correct:2, xp:100, fact:"Proxima Centauri b is just 4.2 light-years away, orbiting our nearest stellar neighbor." },
      { q:"What does 'radial velocity' measure to find planets?", options:["Planet brightness","Star wobble","Orbital period","Planet color"], correct:1, xp:110, fact:"The gravitational pull of a planet causes its host star to wobble — we measure this Doppler shift." },
      { q:"A 'Hot Jupiter' is characterized by:", options:["Low temperature far from star","Earth-like conditions","High mass orbiting very close to its star","Rocky surface with oceans"], correct:2, xp:90, fact:"Hot Jupiters are gas giants so close to their star that a year lasts only days." },
      { q:"The TRAPPIST-1 system has how many potentially habitable planets?", options:["1","2","3","5"], correct:2, xp:130, fact:"TRAPPIST-1 has 3 planets (e, f, g) in or near the habitable zone around this ultra-cool dwarf star." },
      { q:"Which NASA mission discovered the most exoplanets?", options:["Hubble","Voyager","Kepler/K2","James Webb"], correct:2, xp:110, fact:"The Kepler Space Telescope confirmed over 2,600 exoplanets during its 9-year mission." },
      { q:"What year was the first exoplanet around a Sun-like star discovered?", options:["1985","1992","1995","2001"], correct:2, xp:120, fact:"51 Pegasi b was discovered in 1995 by Michel Mayor and Didier Queloz, who won the 2019 Nobel Prize." },
    ];

    const BADGES = [
      { id:"first", icon:"🚀", name:"First Contact", desc:"Answered your first question" },
      { id:"streak3", icon:"🔥", name:"On Fire", desc:"3 correct in a row" },
      { id:"perfect", icon:"⭐", name:"Star Navigator", desc:"Quiz complete with perfect score" },
      { id:"speed", icon:"⚡", name:"Warp Speed", desc:"Answered in under 5 seconds" },
      { id:"explorer", icon:"🌌", name:"Galaxy Explorer", desc:"Completed all quiz questions" },
    ];

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    // ─── PARTICLE BACKGROUND CANVAS ──────────────────────────────
    function StarField() {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let raf;
        const stars = Array.from({ length: 200 }, () => ({
          x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight,
          r: Math.random() * 1.5 + 0.2, speed: Math.random() * 0.15 + 0.03,
          opacity: Math.random() * 0.8 + 0.2, twinkle: Math.random() * Math.PI * 2,
        }));
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        resize(); window.addEventListener("resize", resize);
        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const t = Date.now() * 0.001;
          stars.forEach(s => {
            s.y += s.speed;
            if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
            const op = s.opacity * (0.6 + 0.4 * Math.sin(t * 1.5 + s.twinkle));
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${op})`; ctx.fill();
          });
          raf = requestAnimationFrame(draw);
        };
        draw();
        return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
      }, []);
      return <canvas ref={canvasRef} style={{ position:"fixed", inset:0, width:"100vw", height:"100vh", pointerEvents:"none", zIndex:0 }} />;
    }

    // ─── REUSABLE COMPONENTS ───────────────────────────────────────
    function GlowBtn({ children, onClick, color = COLORS.purple, style = {}, small, disabled }) {
      const [hov, setHov] = useState(false);
      return (
        <button onClick={onClick} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)} disabled={disabled}
          style={{
            background: hov && !disabled ? color : "transparent", border: `1px solid ${disabled ? "rgba(255,255,255,0.2)" : color}`,
            color: disabled ? "rgba(255,255,255,0.4)" : (hov ? "#fff" : color),
            borderRadius: 999, padding: small ? "6px 16px" : "10px 28px", fontSize: small ? 13 : 15, fontWeight: 600,
            cursor: disabled ? "not-allowed" : "pointer", transition: "all 0.25s ease",
            boxShadow: hov && !disabled ? `0 0 20px ${color}88` : "none", letterSpacing: "0.03em", ...style,
          }}>
          {children}
        </button>
      );
    }

    const GlassCard = React.forwardRef(({ children, style = {}, glow, onClick }, ref) => {
      return (
        <div ref={ref} onClick={onClick} style={{
          background: "rgba(255,255,255,0.04)", border: `1px solid ${glow ? glow + "44" : "rgba(255,255,255,0.08)"}`,
          borderRadius: 20, padding: "24px", backdropFilter: "blur(12px)",
          boxShadow: glow ? `0 0 30px ${glow}22` : "none", transition: "all 0.3s ease", ...style,
        }}>
          {children}
        </div>
      );
    });

    function SectionHeader({ title, subtitle }) {
      return (
        <div style={{ textAlign:"center", marginBottom:40 }}>
          <h1 style={{ fontSize:"clamp(1.8rem,4vw,2.8rem)", fontWeight:800, color:"#fff", marginBottom:10, letterSpacing:"-0.02em" }}>{title}</h1>
          <p style={{ fontSize:16, color:"rgba(255,255,255,0.5)", maxWidth:500, margin:"0 auto" }}>{subtitle}</p>
        </div>
      );
    }

    // ─── NAV BAR ─────────────────────────────────────────────────
    function NavBar({ activeSection, setActiveSection }) {
      const navItems = ["Home","Explore","Learn","Simulator","Quiz","Stats","About"];
      return (
        <nav style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 100, background: "rgba(3,7,18,0.85)", backdropFilter: "blur(20px)", borderBottom: "1px solid rgba(255,255,255,0.07)", padding: "0 24px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 64 }}>
          <div style={{ display:"flex", alignItems:"center", gap:10, cursor:"pointer" }} onClick={()=>setActiveSection("Home")}>
            <span style={{ fontSize:24 }}>🪐</span>
            <span style={{ fontSize:16, fontWeight:700, background:`linear-gradient(135deg,${COLORS.pink},${COLORS.purple})`, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>ExoplanetExplorer</span>
          </div>
          <div style={{ display:"flex", gap:4, alignItems:"center", overflowX: "auto" }}>
            {navItems.map(item => (
              <button key={item} onClick={()=>setActiveSection(item)} style={{ background: activeSection===item ? "rgba(167,139,250,0.15)" : "transparent", border: "none", color: activeSection===item ? COLORS.purple : "rgba(255,255,255,0.6)", padding:"6px 14px", borderRadius:99, cursor:"pointer", fontSize:13.5, fontWeight: activeSection===item ? 600 : 400, transition:"all 0.2s" }}>{item}</button>
            ))}
          </div>
        </nav>
      );
    }

    // ─── HERO SECTION + PLANET OF THE DAY ────────────────────────
    function HeroSection({ setActiveSection }) {
      const [count, setCount] = useState(0);
      useEffect(() => {
        let n = 0; const id = setInterval(() => { n += 47; if (n >= 5500) { setCount(5500); clearInterval(id); } else setCount(n); }, 16);
        return () => clearInterval(id);
      }, []);

      const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
      const featured = EXOPLANETS[dayOfYear % EXOPLANETS.length];

      return (
        <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", textAlign:"center", padding:"80px 24px 40px", position:"relative" }}>
          <div style={{ position:"absolute", top:"20%", left:"50%", transform:"translate(-50%,-50%)", width:600, height:400, background:"radial-gradient(ellipse, rgba(167,139,250,0.15) 0%, rgba(96,165,250,0.08) 40%, transparent 70%)", borderRadius:"50%", pointerEvents:"none" }} />
          <div style={{ position:"relative", zIndex:1 }}>
            <div style={{ display:"inline-block", background:"rgba(167,139,250,0.15)", border:"1px solid rgba(167,139,250,0.3)", borderRadius:99, padding:"6px 18px", fontSize:12, color:COLORS.purple, letterSpacing:"0.12em", textTransform:"uppercase", marginBottom:24 }}>
              🛸 NASA-Inspired Educational Platform
            </div>
            <h1 style={{ fontSize:"clamp(2.5rem,7vw,5rem)", fontWeight:800, lineHeight:1.1, margin:"0 0 20px", letterSpacing:"-0.02em" }}>
              <span style={{ background:`linear-gradient(135deg,#fff 0%,${COLORS.purple} 50%,${COLORS.pink} 100%)`, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>Discover Worlds</span><br/>
              <span style={{ background:`linear-gradient(135deg,${COLORS.blue} 0%,${COLORS.cyan} 100%)`, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>Beyond Our Sun</span>
            </h1>
            <p style={{ fontSize:18, color:"rgba(255,255,255,0.65)", maxWidth:560, margin:"0 auto 40px", lineHeight:1.7 }}>
              Explore thousands of exoplanets, simulate alien worlds, and hunt for life beyond Earth — through interactive science and gamified learning.
            </p>
            
            <div style={{ display:"flex", gap:16, justifyContent:"center", flexWrap:"wrap", marginBottom:40 }}>
              <GlowBtn color={COLORS.purple} onClick={()=>setActiveSection("Explore")}>🌌 Start Exploring</GlowBtn>
              <GlowBtn color={COLORS.pink} onClick={()=>setActiveSection("Quiz")}>🎮 Play the Quiz</GlowBtn>
            </div>

            <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:16, padding:"16px 24px", display:"inline-block", textAlign:"left", backdropFilter:"blur(10px)", marginBottom:40 }}>
              <div style={{ fontSize:11, color:COLORS.cyan, letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:8 }}>⭐ Planet of the Day</div>
              <div style={{ display:"flex", alignItems:"center", gap:16 }}>
                <PlanetIcon planet={featured} size={40} />
                <div>
                  <div style={{ fontSize:16, fontWeight:700, color:"#fff" }}>{featured.name}</div>
                  <div style={{ fontSize:12, color:"rgba(255,255,255,0.5)" }}>{featured.type} · {featured.distance} ly away</div>
                </div>
              </div>
            </div>

            <div style={{ display:"flex", gap:32, justifyContent:"center", flexWrap:"wrap" }}>
              {[
                { label:"Confirmed Exoplanets", value: count.toLocaleString()+"+", color:COLORS.purple },
                { label:"Host Stars", value:"4,100+", color:COLORS.blue },
                { label:"Habitable Candidates", value:"50+", color:"#4ade80" },
                { label:"Light-Years Explored", value:"∞", color:COLORS.pink },
              ].map(s => (
                <div key={s.label} style={{ textAlign:"center" }}>
                  <div style={{ fontSize:28, fontWeight:800, color:s.color }}>{s.value}</div>
                  <div style={{ fontSize:12, color:"rgba(255,255,255,0.45)", letterSpacing:"0.06em" }}>{s.label}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─── EXPLORE SECTION (PAGINATION) ────────────────────────────
    function ExploreSection() {
      const [search, setSearch] = useState("");
      const [filter, setFilter] = useState("All");
      const [selected, setSelected] = useState(null);
      const [sortBy, setSortBy] = useState("name");
      const [planetsData, setPlanetsData] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 50;

      useEffect(() => { setCurrentPage(1); }, [search, filter, sortBy]);

      useEffect(() => {
        const fetchLocalData = async () => {
          try {
            setIsLoading(true);
            const response = await fetch('./planets.json');
            if (!response.ok) throw new Error("Gagal membaca file");
            const data = await response.json();
            const livePlanets = data.map((p, index) => {
              let type = "Unknown";
              if (p.pl_rade < 1.25) type = "Earth-sized";
              else if (p.pl_rade < 2.0) type = "Super-Earth";
              else if (p.pl_rade < 6.0) type = "Mini-Neptune";
              else type = "Hot Jupiter";
              const temp = p.pl_eqt || 0;
              const isHabitable = temp > 200 && temp < 320 && p.pl_rade < 2.5;
              return {
                id: `nasa-${index}`, name: p.pl_name || "Unknown",
                radius: p.pl_rade ? p.pl_rade.toFixed(2) : "?", mass: p.pl_bmasse ? p.pl_bmasse.toFixed(2) : "?",
                temp: temp ? Math.round(temp) : "?", distance: p.sy_dist ? Math.round(p.sy_dist * 3.26156) : "?",
                star: p.hostname || "Unknown Star", method: p.discoverymethod || "Unknown",
                habitable: isHabitable, year: p.disc_year || "Unknown", type: type,
                desc: `A ${type} exoplanet discovered around the star ${p.hostname || "an unknown star"} in ${p.disc_year || "an unknown year"} using the ${p.discoverymethod || "unknown"} method.`
              };
            });
            setPlanetsData(livePlanets);
          } catch (error) {
            console.error(error);
            setPlanetsData(EXOPLANETS);
          } finally {
            setIsLoading(false);
          }
        };
        fetchLocalData();
      }, []);

      const types = ["All","Earth-sized","Super-Earth","Mini-Neptune","Hot Jupiter"];
      
      const filtered = planetsData.filter(p => {
        const matchSearch = p.name.toLowerCase().includes(search.toLowerCase()) || p.star.toLowerCase().includes(search.toLowerCase());
        const matchFilter = filter === "All" || p.type === filter;
        return matchSearch && matchFilter;
      }).sort((a,b) => {
        if (sortBy==="name") return a.name.localeCompare(b.name);
        if (sortBy==="distance") return (parseFloat(a.distance) || 99999) - (parseFloat(b.distance) || 99999);
        if (sortBy==="temp") return (parseFloat(a.temp) || 0) - (parseFloat(b.temp) || 0);
        return 0;
      });

      const totalPages = Math.ceil(filtered.length / itemsPerPage);
      const indexOfLastItem = currentPage * itemsPerPage;
      const indexOfFirstItem = indexOfLastItem - itemsPerPage;
      const currentItems = filtered.slice(indexOfFirstItem, indexOfLastItem);

      const goToNextPage = () => setCurrentPage(prev => Math.min(prev + 1, totalPages));
      const goToPrevPage = () => setCurrentPage(prev => Math.max(prev - 1, 1));

      return (
        <div style={{ padding:"40px 24px", maxWidth:1100, margin:"0 auto" }}>
          <SectionHeader title="Exoplanet Database" subtitle={`Exploring ${planetsData.length} confirmed worlds from the NASA Archive`} />
          
          <div style={{ display:"flex", gap:12, flexWrap:"wrap", marginBottom:24 }}>
            <input value={search} onChange={e => setSearch(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } }} placeholder="🔍 Search planets or stars..." style={{ flex:1, minWidth:200, background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.12)", borderRadius:12, padding:"10px 16px", color:"#fff", fontSize:14, outline:"none" }} />
            <select value={sortBy} onChange={e => setSortBy(e.target.value)} style={{ background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.12)", borderRadius:12, padding:"10px 14px", color:"#fff", fontSize:13, cursor:"pointer" }}>
              <option value="name" style={{background:"#1a1a2e"}}>Sort: Name</option>
              <option value="distance" style={{background:"#1a1a2e"}}>Sort: Distance</option>
              <option value="temp" style={{background:"#1a1a2e"}}>Sort: Temperature</option>
            </select>
          </div>
          
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:32 }}>
            {types.map(t => (
              <button key={t} onClick={() => setFilter(t)} style={{ background: filter===t ? COLORS.purple : "rgba(255,255,255,0.05)", border: `1px solid ${filter===t ? COLORS.purple : "rgba(255,255,255,0.1)"}`, color: filter===t ? "#fff" : "rgba(255,255,255,0.6)", borderRadius:99, padding:"5px 16px", fontSize:13, cursor:"pointer", transition:"all 0.2s" }}>{t}</button>
            ))}
          </div>
          
          {isLoading ? (
            <div style={{ textAlign: "center", padding: "80px 20px", color: COLORS.purple }}>
              <div style={{ fontSize: 40, animation: "spin 2s linear infinite", display: "inline-block" }}>🔭</div>
              <div style={{ marginTop: 16, fontSize: 14 }}>LOADING DATA...</div>
            </div>
          ) : (
            <>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:16 }}>
                {currentItems.length > 0 ? (
                  currentItems.map(p => <PlanetCard key={p.id} planet={p} onSelect={setSelected} />)
                ) : (
                  <div style={{ gridColumn:"1/-1", textAlign:"center", padding:"40px", color:"rgba(255,255,255,0.5)" }}>Planet tidak ditemukan.</div>
                )}
              </div>
              
              {totalPages > 1 && (
                <div style={{ display:"flex", justifyContent:"center", alignItems:"center", gap:16, marginTop:40 }}>
                  <GlowBtn small color={COLORS.blue} onClick={goToPrevPage} disabled={currentPage === 1}>&larr; Sebelumnya</GlowBtn>
                  <div style={{ background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:12, padding:"8px 16px", fontSize:14, fontWeight:600, color:"#fff" }}>
                    Hal {currentPage} / {totalPages}
                  </div>
                  <GlowBtn small color={COLORS.blue} onClick={goToNextPage} disabled={currentPage === totalPages}>Selanjutnya &rarr;</GlowBtn>
                </div>
              )}
            </>
          )}
          {selected && <PlanetModal planet={selected} onClose={()=>setSelected(null)} />}
        </div>
      );
    }

    function PlanetCard({ planet, onSelect }) {
      const [hov, setHov] = useState(false);
      const typeColors = { "Earth-sized":"#4ade80","Super-Earth":COLORS.blue,"Mini-Neptune":COLORS.purple,"Hot Jupiter":COLORS.pink };
      const c = typeColors[planet.type] || COLORS.purple;
      return (
        <div onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} onClick={()=>onSelect(planet)}
          style={{ background: hov ? "rgba(255,255,255,0.07)" : "rgba(255,255,255,0.04)", border: `1px solid ${hov ? c+"66" : "rgba(255,255,255,0.08)"}`, borderRadius:16, padding:20, cursor:"pointer", transition:"all 0.3s ease", boxShadow: hov ? `0 8px 32px ${c}22` : "none", transform: hov ? "translateY(-3px)" : "none" }}>
          <div style={{ display:"flex", alignItems:"center", gap:14, marginBottom:14 }}>
            <PlanetIcon planet={planet} size={48} />
            <div>
              <div style={{ fontSize:15, fontWeight:700, color:"#fff", marginBottom:2 }}>{planet.name}</div>
              <div style={{ fontSize:12, color:"rgba(255,255,255,0.5)" }}>⭐ {planet.star}</div>
            </div>
            {planet.habitable && <div style={{ marginLeft:"auto", fontSize:18 }} title="Potentially Habitable">🌱</div>}

    function LearnSection() {

        { heading:"Extrasolar Planets — Worlds Beyond Our Sun", body:"An exoplanet (or extrasolar planet) is any planet that orbits a star outside our Solar System. Since the first confirmed discovery in 1995, astronomers have confirmed over 5,500 exoplanets — with thousands more candidates awaiting confirmation.\n\nThese worlds come in astonishing variety: scorching gas giants orbiting closer to their star than Mercury, frozen super-Earths, diamond planets, lava worlds, and potentially Earth-like rocky worlds in habitable zones.\n\nWhy do exoplanets matter? Because every new world discovered expands our understanding of how planetary systems form, and each potentially habitable one brings us closer to answering humanity's deepest question: Are we alone in the universe?", visual:"🌌" },
        { heading:"The Transit Method — Catching a Planet's Shadow", body:"When a planet passes in front of its host star (called a transit), it blocks a small fraction of starlight — causing a measurable dip in brightness. By analyzing the timing, depth, and shape of these dips, astronomers can determine:\n\n• Planet size (deeper dip = larger planet)\n• Orbital period (time between transits = one year on that planet)\n• Atmosphere composition (light filters through the atmosphere, leaving chemical fingerprints)\n\nThe Kepler Space Telescope used this method to discover over 2,600 confirmed exoplanets by staring at 150,000 stars simultaneously for years. The James Webb Space Telescope now uses transit spectroscopy to study exoplanet atmospheres in unprecedented detail.", visual:"⭐" },
        { heading:"Radial Velocity — Listening to the Wobble", body:"Stars aren't perfectly stationary — a massive orbiting planet tugs on its star gravitationally, causing the star to \"wobble\" in a tiny orbit around their common center of mass. This wobble causes the star's light to shift in frequency as it moves toward and away from us (the Doppler Effect).\n\nWhen the star moves toward us, its light blueshifts. When it moves away, it redshifts. By measuring these tiny periodic shifts (sometimes just meters per second!), astronomers can detect:\n\n• Planet mass (stronger wobble = more massive planet)\n• Orbital period (wobble timing = orbital period)\n• Orbital eccentricity (shape of the wobble pattern)\n\nThis method works best for massive planets close to their star, which is why the first exoplanets discovered were \"Hot Jupiters.\"", visual:"📡" },
        { heading:"The Habitable Zone — Goldilocks Region", body:"The habitable zone (also called the Goldilocks zone) is the range of orbital distances around a star where liquid water could theoretically exist on a planet's surface — not too hot, not too cold, but just right.\n\nFor our Sun, the habitable zone spans roughly 0.95 to 1.67 AU (Earth's distance = 1 AU). But habitability is complex:\n\n• Smaller, cooler stars (M-dwarfs) have much closer-in habitable zones\n• Greenhouse gases can extend a zone (Mars might have been habitable once)\n• Ice shell worlds can have subsurface liquid water far outside the zone (like Europa)\n• Tidal locking can create extreme temperature differences on one side vs. the other\n\nThe presence of liquid water is considered the primary prerequisite for life as we know it, making the habitable zone a key focus in the search for life.", visual:"🌱" },
        { heading:"Planet Types — A Cosmic Zoo", body:"Exoplanets defy our Solar System's categories. Here are the main types:\n\n🔵 Earth-sized planets — Rocky worlds similar in size to Earth; the most sought-after for habitability\n🟠 Super-Earths — 1.25–2× Earth radius; could be rocky, ocean worlds, or mini-Neptunes\n🟣 Mini-Neptunes — 2–4× Earth radius; likely have thick hydrogen/helium envelopes\n🔴 Hot Jupiters — Gas giants orbiting extremely close to their star; scorching and tidally locked\n⚪ Cold Jupiters — Gas giants in wide orbits, similar to our Solar System's Jupiter\n💎 Diamond planets — Ultra-high-pressure worlds where carbon crystallizes into diamond\n🌊 Ocean worlds — Planets potentially covered entirely by global oceans", visual:"🪐" },
        { heading:"The Search for Life Beyond Earth", body:"Are we alone? This question drives modern astrobiology — the study of life's potential in the cosmos.\n\nScientists look for several key biosignatures (signs of life):\n• Oxygen and ozone in atmospheres (products of photosynthesis)\n• Methane alongside oxygen (these would rapidly react without constant replenishment)\n• Water vapor\n• Phosphine gas (controversially detected on Venus)\n• Chemical disequilibrium (life constantly disturbs a planet's chemistry)\n\nThe James Webb Space Telescope is actively studying TRAPPIST-1 planets and can detect atmospheric biosignatures in detail never before possible. Meanwhile, missions like Mars rovers search for ancient microbial fossils, and efforts to explore Europa's subsurface ocean may reveal extraterrestrial life much closer to home.", visual:"👽" },
      ];
      return (

    // ─── SIMULATOR SECTION (Dengan Fisika) ───────────────────────
    function OrbitCanvas({ distance, radius, speed, temp, showHZ }) {
      const canvasRef = useRef(null);
      const angleRef = useRef(0);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let raf;
        const W = canvas.width = 400; const H = canvas.height = 400;
        const cx = W / 2, cy = H / 2; const starR = 28;
        const orbitR = clamp(distance * 1.4, 60, 170); const planetR = clamp(radius * 5, 5, 28);
        const draw = () => {
          ctx.clearRect(0, 0, W, H);
          if (showHZ) {
            const g = ctx.createRadialGradient(cx, cy, 75, cx, cy, 130);
            g.addColorStop(0, "rgba(74,222,128,0)"); g.addColorStop(0.3, "rgba(74,222,128,0.13)");
            g.addColorStop(0.7, "rgba(74,222,128,0.1)"); g.addColorStop(1, "rgba(74,222,128,0)");
            ctx.beginPath(); ctx.arc(cx, cy, 130, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
          }
          const starColor = temp > 1000 ? [255,120,50] : temp > 300 ? [255,200,80] : [120,180,255];
          const sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, starR * 2.5);
          sg.addColorStop(0, `rgba(${starColor},1)`); sg.addColorStop(0.4, `rgba(${starColor},0.5)`); sg.addColorStop(1, "rgba(0,0,0,0)");
          ctx.beginPath(); ctx.arc(cx, cy, starR * 2.5, 0, Math.PI * 2); ctx.fillStyle = sg; ctx.fill();
          ctx.beginPath(); ctx.arc(cx, cy, starR, 0, Math.PI * 2); ctx.fillStyle = `rgb(${starColor})`; ctx.fill();
          ctx.beginPath(); ctx.arc(cx, cy, orbitR, 0, Math.PI * 2); ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.lineWidth = 1; ctx.setLineDash([4,6]); ctx.stroke(); ctx.setLineDash([]);
          angleRef.current += (speed * 0.008);
          const px = cx + orbitR * Math.cos(angleRef.current); const py = cy + orbitR * Math.sin(angleRef.current);
          let pColor;
          if (temp < 200) pColor = [100,150,255]; else if (temp < 350) pColor = [74,200,130]; else if (temp < 700) pColor = [255,180,60]; else pColor = [255,80,40];
          const pg = ctx.createRadialGradient(px-planetR*0.3, py-planetR*0.3, 0, px, py, planetR);
          pg.addColorStop(0, `rgb(${pColor.map(c=>Math.min(255,c+80)).join(',')})`); pg.addColorStop(1, `rgb(${pColor.join(',')})`);
          ctx.beginPath(); ctx.arc(px, py, planetR, 0, Math.PI * 2); ctx.fillStyle = pg; ctx.fill();
          raf = requestAnimationFrame(draw);
        };
        draw(); return () => cancelAnimationFrame(raf);
      }, [distance, radius, speed, temp, showHZ]);
      return <canvas ref={canvasRef} width={400} height={400} style={{ width:"100%", maxWidth:400, borderRadius:16 }} />;
    }

                    <div style={{ fontSize:11, color:"rgba(255,255,255,0.4)", marginTop:4 }}>{isHabitable ? "🌱 Kondisi mendukung kehidupan!" : "⚠️ Lingkungan ekstrim"}</div>
                  </div>

              <h3 style={{ color:COLORS.blue, fontSize:16, fontWeight:600, marginBottom:16 }}>🔭 Visualisasi Orbit</h3>

              </div>

              </div>
              <div>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#fff", marginBottom: 4 }}>Atmospheric Retention</div>
                <div style={{ fontSize: 13, color: "rgba(255,255,255,0.7)", lineHeight: 1.5 }}>Density and <strong>Radius</strong> greatly affects the escape velocity. Planets smaller than 0.5× Earth have difficulty binding atmospheric gases.</div>

    // ─── QUIZ SECTION (Dari kode awal Fathir) ────────────────────
    function QuizSection() {
      const [phase, setPhase] = useState("lobby"); const [qIdx, setQIdx] = useState(0);
      const [score, setScore] = useState(0); const [xp, setXp] = useState(0);
      const [selected, setSelected] = useState(null); const [answered, setAnswered] = useState(false);
      const [timer, setTimer] = useState(15); const [streak, setStreak] = useState(0);
      const [badges, setBadges] = useState([]); const [history, setHistory] = useState([]);
      const [combo, setCombo] = useState(1); const timerRef = useRef(null);
      const q = QUIZ_QUESTIONS[qIdx];

      const startQuiz = () => { setPhase("playing"); setQIdx(0); setScore(0); setXp(0); setStreak(0); setBadges([]); setHistory([]); setCombo(1); startTimer(); };
      const startTimer = useCallback(() => {
        setTimer(15); clearInterval(timerRef.current);
        timerRef.current = setInterval(() => { setTimer(t => { if (t <= 1) { clearInterval(timerRef.current); handleAnswer(null, true); return 0; } return t - 1; }); }, 1000);
      }, []);

      const handleAnswer = (optIdx) => {
        if (answered) return; clearInterval(timerRef.current); setSelected(optIdx); setAnswered(true);
        const correct = q.correct; const isCorrect = optIdx === correct; const isSpeed = timer > 10;
        const newBadges = [...badges]; const newHistory = [...history, { question:q.q, correct:isCorrect }];
        let newStreak = isCorrect ? streak + 1 : 0; let newCombo = isCorrect ? Math.min(combo + 0.5, 4) : 1;
        let gainedXp = 0;

        if (isCorrect) {
          gainedXp = Math.round(q.xp * newCombo);
          if (newHistory.length === 1 && !badges.find(b=>b.id==="first")) newBadges.push(BADGES[0]);
          if (newStreak >= 3 && !badges.find(b=>b.id==="streak3")) newBadges.push(BADGES[1]);
          if (isSpeed && !badges.find(b=>b.id==="speed")) newBadges.push(BADGES[3]);
        }
        if (qIdx === QUIZ_QUESTIONS.length - 1) {
          if (!badges.find(b=>b.id==="explorer")) newBadges.push(BADGES[4]);
          if (newHistory.every(h=>h.correct) && isCorrect && !badges.find(b=>b.id==="perfect")) newBadges.push(BADGES[2]);
        }
        setStreak(newStreak); setCombo(newCombo); setHistory(newHistory); setBadges(newBadges);
        if (isCorrect) { setScore(s=>s+1); setXp(x=>x+gainedXp); }
      };

      const nextQuestion = () => { if (qIdx < QUIZ_QUESTIONS.length - 1) { setQIdx(i=>i+1); setSelected(null); setAnswered(false); setTimeout(startTimer, 100); } else { setPhase("result"); } };
      useEffect(() => { return () => clearInterval(timerRef.current); }, []);

      if (phase === "lobby") return <QuizLobby onStart={startQuiz} />;
      if (phase === "result") return <QuizResult score={score} total={QUIZ_QUESTIONS.length} xp={xp} badges={badges} onRestart={()=>setPhase("lobby")} />;

      return (
        <div style={{ padding:"40px 24px", maxWidth:780, margin:"0 auto" }}>
          <div style={{ display:"flex", gap:12, flexWrap:"wrap", marginBottom:24, alignItems:"center" }}>
            <div style={{ flex:1, display:"flex", gap:12 }}>
              <StatPill icon="⭐" label="XP" value={xp} color={COLORS.purple} />
              <StatPill icon="🔥" label="Streak" value={streak} color={COLORS.pink} />
              <StatPill icon="✅" label="Score" value={`${score}/${qIdx}`} color="#4ade80" />
              {combo > 1 && <StatPill icon="⚡" label="Combo" value={`×${combo.toFixed(1)}`} color="#fbbf24" />}
            </div>
            <div style={{ position:"relative", width:52, height:52 }}>
              <svg width="52" height="52" style={{ transform:"rotate(-90deg)" }}>
                <circle cx="26" cy="26" r="22" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="3" />
                <circle cx="26" cy="26" r="22" fill="none" stroke={timer>8?COLORS.blue:timer>4?COLORS.pink:"#f87171"} strokeWidth="3" strokeDasharray={`${2*Math.PI*22}`} strokeDashoffset={`${2*Math.PI*22*(1-timer/15)}`} style={{ transition:"stroke-dashoffset 1s linear, stroke 0.3s" }} />
              </svg>
              <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", fontSize:16, fontWeight:700, color:timer>4?"#fff":"#f87171" }}>{timer}</div>
            </div>
          </div>
          <div style={{ height:4, background:"rgba(255,255,255,0.1)", borderRadius:99, marginBottom:24, overflow:"hidden" }}>
            <div style={{ height:"100%", width:`${(qIdx/QUIZ_QUESTIONS.length)*100}%`, background:`linear-gradient(90deg,${COLORS.purple},${COLORS.pink})`, borderRadius:99, transition:"width 0.5s ease" }} />
          </div>
          <GlassCard glow={COLORS.purple} style={{ marginBottom:20 }}>
            <div style={{ fontSize:11, color:COLORS.purple, letterSpacing:"0.12em", textTransform:"uppercase", marginBottom:12 }}>🛸 Question {qIdx+1} of {QUIZ_QUESTIONS.length}</div>
            <h2 style={{ fontSize:20, fontWeight:700, color:"#fff", lineHeight:1.4, margin:0 }}>{q.q}</h2>
          </GlassCard>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:20 }}>
            {q.options.map((opt,i) => {
              const isCorrect = i === q.correct; const isSelected = i === selected;
              let bg = "rgba(255,255,255,0.05)", border = "rgba(255,255,255,0.12)", color = "rgba(255,255,255,0.8)";
              if (answered) { if (isCorrect) { bg="rgba(74,222,128,0.15)"; border="#4ade80"; color="#4ade80"; } else if (isSelected && !isCorrect) { bg="rgba(248,113,113,0.15)"; border="#f87171"; color="#f87171"; } }
              return (
                <button key={i} onClick={()=>handleAnswer(i)} disabled={answered} style={{ background:bg, border:`1px solid ${border}`, borderRadius:12, padding:"14px 18px", color, cursor:answered?"default":"pointer", textAlign:"left", fontSize:14, fontWeight:500, transition:"all 0.3s", lineHeight:1.4 }}>
                  <span style={{ color:"rgba(255,255,255,0.3)", marginRight:8 }}>{["A","B","C","D"][i]}</span>{opt}
                </button>
              );
            })}
          </div>
          {answered && (
            <GlassCard style={{ marginBottom:20, borderColor:selected===q.correct?"#4ade8044":"rgba(248,113,113,0.3)" }}>
              <div style={{ fontSize:14, color:"rgba(255,255,255,0.8)", lineHeight:1.7 }}>{selected===q.correct ? "✅ Correct! " : "❌ Not quite. "}<span style={{ color:"rgba(255,255,255,0.6)" }}>{q.fact}</span></div>
              <GlowBtn color={COLORS.purple} onClick={nextQuestion} style={{ marginTop:12 }}>{qIdx<QUIZ_QUESTIONS.length-1?"Next Question →":"See Results 🏆"}</GlowBtn>
            </GlassCard>
          )}
        </div>
      );
    }
    function StatPill({ icon, label, value, color }) { return (<div style={{ background:`${color}15`, border:`1px solid ${color}44`, borderRadius:99, padding:"5px 14px", display:"flex", gap:6, alignItems:"center" }}><span style={{ fontSize:14 }}>{icon}</span><span style={{ fontSize:11, color:"rgba(255,255,255,0.5)" }}>{label}</span><span style={{ fontSize:14, fontWeight:700, color }}>{value}</span></div>); }
    function QuizLobby({ onStart }) {
      return (
        <div style={{ padding:"40px 24px", maxWidth:700, margin:"0 auto", textAlign:"center" }}>
          <div style={{ fontSize:80, marginBottom:20 }}>🚀</div>
          <h1 style={{ fontSize:36, fontWeight:800, color:"#fff", marginBottom:12 }}>Planet Hunter Mission</h1>
          <p style={{ color:"rgba(255,255,255,0.6)", fontSize:16, lineHeight:1.7, marginBottom:32 }}>Test your exoplanet knowledge across {QUIZ_QUESTIONS.length} challenges. Earn XP, build combos, unlock badges, and prove you're a true Space Explorer!</p>
          <GlowBtn color={COLORS.purple} onClick={onStart} style={{ fontSize:17, padding:"14px 40px" }}>🛸 Launch Mission</GlowBtn>
        </div>
      );
    }
    function QuizResult({ score, total, xp, badges, onRestart }) {
      const pct = Math.round((score/total)*100); const rank = pct===100?"🏆 Legendary Explorer":pct>=75?"⭐ Star Navigator":pct>=50?"🚀 Cadet Pilot":"🌙 Space Recruit";
      return (
        <div style={{ padding:"40px 24px", maxWidth:700, margin:"0 auto", textAlign:"center" }}>
          <div style={{ fontSize:72, marginBottom:12 }}>{pct===100?"🏆":pct>=75?"⭐":"🚀"}</div>
          <h1 style={{ fontSize:36, fontWeight:800, color:"#fff", marginBottom:8 }}>{rank}</h1>
          <div style={{ fontSize:52, fontWeight:800, background:`linear-gradient(135deg,${COLORS.purple},${COLORS.pink})`, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", marginBottom:8 }}>{score}/{total}</div>
          <p style={{ color:"rgba(255,255,255,0.6)", marginBottom:32 }}>You earned <span style={{ color:COLORS.purple, fontWeight:700 }}>{xp} XP</span> in this mission!</p>
          <GlowBtn color={COLORS.purple} onClick={onRestart}>🔄 Play Again</GlowBtn>
        </div>
      );
    }

    // ─── STATS SECTION (Dari kode awal Fathir) ───────────────────
    function StatsSection() {
      const [activeChart, setActiveChart] = useState("types");
      const data = {
        types: [ { label:"Super-Earths", value:32, color:COLORS.blue }, { label:"Neptune-like", value:31, color:COLORS.purple }, { label:"Gas Giants", value:15, color:COLORS.pink }, { label:"Terrestrial", value:4, color:"#4ade80" }, { label:"Unknown", value:18, color:"rgba(255,255,255,0.3)" } ],
        methods: [ { label:"Transit", value:76, color:COLORS.purple }, { label:"Radial Velocity", value:19, color:COLORS.blue }, { label:"Microlensing", value:3, color:COLORS.pink }, { label:"Direct Imaging", value:1, color:"#4ade80" }, { label:"Other", value:1, color:COLORS.cyan } ],
      };
      return (
        <div style={{ padding:"40px 24px", maxWidth:1000, margin:"0 auto" }}>
          <SectionHeader title="Exoplanet Statistics" subtitle="Real data from NASA's Exoplanet Archive" />
          <div style={{ display:"flex", gap:8, marginBottom:24, flexWrap:"wrap" }}>
            {[{ key:"types", label:"By Type" }, { key:"methods", label:"By Discovery Method" }].map(c => (
              <button key={c.key} onClick={()=>setActiveChart(c.key)} style={{ background: activeChart===c.key ? COLORS.purple : "rgba(255,255,255,0.05)", border: `1px solid ${activeChart===c.key ? COLORS.purple : "rgba(255,255,255,0.1)"}`, color: activeChart===c.key ? "#fff" : "rgba(255,255,255,0.6)", borderRadius:99, padding:"6px 18px", fontSize:13, cursor:"pointer", transition:"all 0.2s" }}>{c.label}</button>
            ))}
          </div>
          <GlassCard style={{ minWidth:200 }}>
            {data[activeChart].map((item,i) => (
              <div key={i} style={{ marginBottom:16 }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}><span style={{ fontSize:13, color:"rgba(255,255,255,0.7)" }}>{item.label}</span><span style={{ fontSize:13, fontWeight:700, color:item.color }}>{item.value}%</span></div>
                <div style={{ height:8, background:"rgba(255,255,255,0.08)", borderRadius:99, overflow:"hidden" }}><div style={{ height:"100%", width:`${item.value}%`, background:item.color, borderRadius:99, boxShadow:`0 0 8px ${item.color}88` }} /></div>
              </div>
            ))}
          </GlassCard>
        </div>
      );
    }

    // ─── ABOUT SECTION (Dari kode awal Fathir) ───────────────────
    function AboutSection() {
      return (
        <div style={{ padding:"40px 24px", maxWidth:1000, margin:"0 auto" }}>
          <SectionHeader title="About This Project" subtitle="Mission, team, and resources" />
          <div style={{ textAlign:"center", marginBottom:24 }}>
            <div style={{ display:"inline-block", background:"rgba(244,114,182,0.15)", border:"1px solid rgba(244,114,182,0.3)", borderRadius:99, padding:"6px 18px", fontSize:12, color:COLORS.pink, letterSpacing:"0.12em", textTransform:"uppercase", marginBottom:12 }}>✨ Created By</div>
            <h2 style={{ fontSize:28, fontWeight:700, color:"#fff" }}>The Team Behind the Mission</h2>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))", gap:20, marginBottom:40 }}>
            {[
              { name:"Radhwa Haifa Dzakira", role:"Lead Developer & UI Designer", emoji:"👩‍🚀", color:COLORS.purple, desc:"Architected the interactive simulator and planet visualization systems." },
              { name:"Selpi Yanti", role:"Educational Content & Research", emoji:"🌠", color:COLORS.pink, desc:"Curated exoplanet data, educational content, and quiz question design." },
              { name:"Fathirahim Maulaya Ahmad", role:"Animation & UX Engineer", emoji:"🔭", color:COLORS.blue, desc:"Built the gamified quiz system, animations, and orbital mechanics engine." },
            ].map(c => (
              <div key={c.name} style={{ background:"rgba(255,255,255,0.04)", border:`1px solid ${c.color}44`, borderRadius:20, padding:24, textAlign:"center", boxShadow:`0 0 40px ${c.color}18`, transition:"all 0.3s" }}>
                <div style={{ width:72, height:72, borderRadius:"50%", background:`${c.color}22`, border:`2px solid ${c.color}55`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:36, margin:"0 auto 16px" }}>{c.emoji}</div>
                <div style={{ fontSize:16, fontWeight:700, color:"#fff", marginBottom:4 }}>{c.name}</div>
                <div style={{ fontSize:12, color:c.color, fontWeight:600, marginBottom:12, letterSpacing:"0.04em" }}>{c.role}</div>
                <p style={{ fontSize:13, color:"rgba(255,255,255,0.55)", lineHeight:1.6 }}>{c.desc}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─── BOTTOM NAV MOBILE ───────────────────────────────────────
    function BottomNav({ activeSection, setActiveSection }) {
      const items = [
        { key:"Home", icon:"🏠" }, { key:"Explore", icon:"🌌" }, { key:"Learn", icon:"📚" },
        { key:"Simulator", icon:"🎛️" }, { key:"Quiz", icon:"🎮" }, { key:"Stats", icon:"📊" }, { key:"About", icon:"👥" },
      ];
      return (
        <div style={{ position:"fixed", bottom:0, left:0, right:0, zIndex:100, background:"rgba(3,7,18,0.95)", backdropFilter:"blur(20px)", borderTop:"1px solid rgba(255,255,255,0.07)", display:"flex", justifyContent:"space-around", padding:"8px 0 4px" }}>
          {items.map(item => (
            <button key={item.key} onClick={()=>setActiveSection(item.key)} style={{ background:"none", border:"none", display:"flex", flexDirection:"column", alignItems:"center", gap:2, color: activeSection===item.key ? COLORS.purple : "rgba(255,255,255,0.4)", cursor:"pointer", padding:"4px 8px" }}>
              <span style={{ fontSize:18 }}>{item.icon}</span><span style={{ fontSize:9, fontWeight: activeSection===item.key?600:400 }}>{item.key}</span>
            </button>
          ))}
        </div>
      );
    }

    // ─── MAIN APP ─────────────────────────────────────────────────
    function App() {
      const [activeSection, setActiveSection] = useState("Home");
      const [loading, setLoading] = useState(true);

      useEffect(() => { const t = setTimeout(() => setLoading(false), 2200); return () => clearTimeout(t); }, []);

      if (loading) return (
        <div style={{ position:"fixed", inset:0, background:COLORS.bg, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", zIndex:999 }}>
          <StarField />
          <div style={{ position:"relative", zIndex:1, textAlign:"center" }}>
            <div style={{ fontSize:64, marginBottom:16, display:"inline-block" }}>🪐</div>
            <h1 style={{ fontSize:32, fontWeight:800, background:`linear-gradient(135deg,${COLORS.purple},${COLORS.pink})`, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", marginBottom:8 }}>Exoplanet Explorer</h1>
            <div style={{ fontSize:14, color:"rgba(255,255,255,0.4)", letterSpacing:"0.12em" }}>INITIALIZING STELLAR COORDINATES...</div>
          </div>
        </div>
      );

      const sections = { Home:HeroSection, Explore:ExploreSection, Learn:LearnSection, Simulator:SimulatorSection, Quiz:QuizSection, Stats:StatsSection, About:AboutSection };
      const ActiveSection = sections[activeSection] || HeroSection;

      return (
        <div style={{ background:COLORS.bg, minHeight:"100vh", fontFamily:"-apple-system,'Segoe UI',sans-serif", color:"#fff", position:"relative" }}>
          <StarField />
          <div style={{ position:"fixed", top:"10%", right:"5%", width:500, height:500, background:"radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%)", pointerEvents:"none", zIndex:0 }} />
          <NavBar activeSection={activeSection} setActiveSection={setActiveSection} />
          <main style={{ paddingTop:64, paddingBottom:80, position:"relative", zIndex:1 }}>
            <ActiveSection setActiveSection={setActiveSection} />
          </main>
          <BottomNav activeSection={activeSection} setActiveSection={setActiveSection} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
